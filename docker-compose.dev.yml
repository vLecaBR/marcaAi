# MarcaAí — infraestrutura de DESENVOLVIMENTO (Postgres 18 + Mailpit).
# Uso:  docker compose -f docker-compose.dev.yml up -d
# Postgres em localhost:5433 (5432 fica livre p/ o PostgreSQL nativo do Windows).
# Mailpit: SMTP :1025 · UI http://localhost:8025
name: marcaai-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marcaai}
      POSTGRES_DB: ${POSTGRES_DB:-marcaai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+: montar em /var/lib/postgresql (não mais em .../data)
      - marcaai_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcaai} -d ${POSTGRES_DB:-marcaai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  marcaai_pgdata:
